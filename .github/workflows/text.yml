name: Ecommerce Parallel CI/CD
on:
    workflow_dispatch:
permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  FRONTEND_ECR: ecommerce-frontend
  BACKEND_ECR: ecommerce-backend
  ECS_CLUSTER: ecommerce-cluster
  FRONTEND_TASK_DEF: frontend-taskdef.json
  BACKEND_TASK_DEF: backend-taskdef.json
  CODEDEPLOY_APP: ecommerce-app
jobs:

# --------------------------------
# 1 PRETTIER CHECK
# --------------------------------
 prettier:
  runs-on: ubuntu-latest
  steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 18
    - run: npm install
    - run: npx prettier --check .

# --------------------------------
# 2 SONARQUBE SCAN
# --------------------------------
 sonarqube:
  runs-on: ubuntu-latest
  needs: prettier
  steps:
    - uses: actions/checkout@v4
    - name: SonarQube scan
      uses: SonarSource/sonarqube-scan-action@v2
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        SONAR_HOST_URL: ${{ secrets.SONAR_HOST }}

# --------------------------------
# 3 TRIVY SOURCE SCAN
# --------------------------------
 trivy_source:
  runs-on: ubuntu-latest
  needs: sonarqube
  steps:
    - uses: actions/checkout@v4
    - name: Trivy source scan
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        severity: HIGH,CRITICAL

# --------------------------------
# 4 PARALLEL: BUILD FRONTEND IMAGE
# --------------------------------
 build_frontend:
  runs-on: ubuntu-latest
  needs: trivy_source
  steps:
    - uses: actions/checkout@v4
    - name: AWS OIDC Login
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}
    - uses: aws-actions/amazon-ecr-login@v2
    - name: Build frontend image
      run: docker build -t frontend ./frontend
    - name: Trivy image scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: frontend
        severity: HIGH,CRITICAL
    - name: Tag & Push frontend
      run: |
        docker tag frontend:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_ECR:${{ github.sha }}
        docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_ECR:${{ github.sha }}
    - name: Update Frontend ECS Task
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.FRONTEND_TASK_DEF }}
        container-name: frontend
        image: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$FRONTEND_ECR:${{ github.sha }}

# --------------------------------
# 3 TRIVY SOURCE SCAN forntend 
# --------------------------------
 trivy_frontend_image:
  runs-on: ubuntu-latest
  needs: build_frontend
  steps:
    - uses: actions/checkout@v4
    - name: Trivy scan Frontend Image
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        severity: HIGH,CRITICAL
        
# --------------------------------
# 5 PARALLEL: BUILD BACKEND IMAGE
# --------------------------------
 build_backend:
  runs-on: ubuntu-latest
  needs: trivy_source
  steps:
    - uses: actions/checkout@v4
    - name: AWS OIDC Login
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}
    - uses: aws-actions/amazon-ecr-login@v2
    - name: Build backend image
      run: docker build -t backend ./backend
    - name: Trivy image scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: backend
        severity: HIGH,CRITICAL
    - name: Tag & Push backend
      run: |
        docker tag backend:latest $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_ECR:${{ github.sha }}
        docker push $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_ECR:${{ github.sha }}
    - name: Update Backend ECS Task
      uses: aws-actions/amazon-ecs-render-task-definition@v1
      with:
        task-definition: ${{ env.BACKEND_TASK_DEF }}
        container-name: backend
        image: $AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$BACKEND_ECR:${{ github.sha }}

 # --------------------------------
# 3 TRIVY SOURCE SCAN Backend 
# --------------------------------
 trivy_backend_image:
  runs-on: ubuntu-latest
  needs: build_backend
  steps:
    - uses: actions/checkout@v4
    - name: Trivy scan Backend Image
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: fs
        severity: HIGH,CRITICAL
# --------------------------------
# 6 DEPLOY TO DEV
# --------------------------------


# --------------------------------
# 7 DEPLOY TO STAGING AFTER DEV SUCCESS
# --------------------------------


# --------------------------------
# 8 DEPLOY TO PROD AFTER STAGING SUCCESS
# --------------------------------
 deploy_prod:
  runs-on: ubuntu-latest
  needs: [trivy_backend_image, trivy_frontend_image] 
  steps:
    - uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_ROLE }}
        aws-region: ${{ env.AWS_REGION }}
    - name: Deploy to PRODUCTION
      run: |
        aws deploy create-deployment \
          --application-name $CODEDEPLOY_APP \
          --deployment-group-name prod-deployment \
          --deployment-config-name CodeDeployDefault.ECSAllAtOnce

# --------------------------------
# 9 SLACK NOTIFICATION
# --------------------------------
 notify:
  runs-on: ubuntu-latest
  needs: deploy_prod
  if: always()
  steps:
    - name: Slack Notification
      uses: slackapi/slack-github-action@v1
      with:
        payload: |
          {
            "text": "Ecommerce deployment completed for branch ${{ github.ref_name }}"
          }
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
